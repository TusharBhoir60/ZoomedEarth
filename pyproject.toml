[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomedearth"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "sen2sr>=0.8.5",
    "rasterio>=1.4.4",
    "pystac-client>=0.9.0",
    "pystac>=1.15.0",
    "PyYAML>=6.0.1",
    "numpy>=1.26.0",
    "safetensors>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
